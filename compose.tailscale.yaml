# Private deployment on your tailnet: https://secretary.<your-tailnet>.ts.net, reachable only from
# your Tailscale devices (or public with TS_SERVE_FILE=tailscale-funnel.json). No domain, open
# ports or Caddy needed. See docs/deploy.md.
#   docker compose -f compose.tailscale.yaml up -d --build
services:
  tailscale:
    image: tailscale/tailscale:v1.76.6
    hostname: secretary
    restart: unless-stopped
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY:?Set TS_AUTHKEY in .env}"
      TS_HOSTNAME: "${TS_HOSTNAME:-secretary}"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./deploy/${TS_SERVE_FILE:-tailscale-serve.json}:/config/serve.json:ro

  app:
    build: .
    restart: unless-stopped
    network_mode: service:tailscale  # only Tailscale Serve, on localhost, reaches the app
    depends_on: [tailscale]
    environment:
      SECRETARY_COOKIE_SECURE: "1"
    volumes:
      - secretary_data:/data
      - secretary_backups:/backups

volumes:
  tailscale_state:
  secretary_data:
  secretary_backups:

# Render Blueprint: free web service. Data is kept by Litestream in Backblaze B2 (docs/deploy.md).
services:
  - type: web
    name: secretary
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    dockerCommand: /app/deploy/render-start.sh
    envVars:
      - key: PORT
        value: "8000"
      - key: SECRETARY_COOKIE_SECURE
        value: "1"
      - key: FORWARDED_ALLOW_IPS
        value: 10.0.0.0/8
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
      - key: SECRETARY_ADMIN_USERNAME
        sync: false
      - key: SECRETARY_ADMIN_PASSWORD
        sync: false
